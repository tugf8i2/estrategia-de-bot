build:
  system: docker
  min_cpu: 0.2
  max_cpu: 0.5
  min_memory: 256
  max_memory: 512

dockerfile_path: ./Dockerfile
start_command: python cloud_app.py

scaling:
  trigger: http_requests
  min_replicas: 1
  max_replicas: 1
  min_cpu: 0.1
  max_cpu: 0.5
  min_memory: 256
  max_memory: 256

health_check:
  type: http
  http_path: /health
  interval_in_seconds: 30
